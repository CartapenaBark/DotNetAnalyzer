name: Bug Report
description: Report a bug in DotNetAnalyzer
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in the information below to help us quickly locate and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: A brief description of the problem
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How to reproduce this issue
      placeholder: |
        1. Use the '...' command
        2. Select the '....' file
        3. Scroll to '....' position
        4. Error occurs
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
      placeholder: What actually happened?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Information
      description: Runtime environment details
      placeholder: |
        - OS: [e.g. Windows 11, Ubuntu 22.04]
        - .NET Version: [e.g. 8.0.301]
        - DotNetAnalyzer Version: [e.g. v0.8.0]
        - MCP Client: [e.g. Claude Code, VSCode Extension]
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Output
      description: Relevant logs or error messages
      render: shell
      placeholder: |
        Error messages or stack traces...
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: Configuration File
      description: If relevant, please provide your MCP configuration file
      render: yaml
      placeholder: |
        .mcp.json contents...
    validations:
      required: false

  - type: textarea
    id: project
    attributes:
      label: Test Project
      description: If possible, provide a minimal reproducible test project
      placeholder: Link to a GitHub repository or describe the project structure
    validations:
      required: false

  - type: checkboxes
    id: additional
    attributes:
      label: Additional Information
      options:
        - label: I have searched existing issues and did not find a duplicate
          required: true
        - label: I am willing to help fix this issue
          required: false
        - label: This is a security issue (please do not publicly report security issues on GitHub)
          required: false

  - type: markdown
    attributes:
      value: |
        ---
        **Note**: If this is a security issue, please do not submit an issue. See [SECURITY.md](../../SECURITY.md) for how to privately report security vulnerabilities.
