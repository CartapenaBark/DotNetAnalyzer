name: Documentation Improvement
description: Report documentation issues or suggest documentation improvements
title: "[Docs]: "
labels: ["documentation", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the documentation! Please tell us what needs to be improved.

  - type: dropdown
    id: doc-type
    attributes:
      label: Documentation Type
      description: Which document needs improvement?
      options:
        - README.md
        - API Guide (docs/api-guide.md)
        - Coding Standards (docs/CODING_STANDARDS.md)
        - Development Workflow (docs/development-workflow.md)
        - Usage Examples (docs/examples.md)
        - Configuration Guide (CONFIGURATION.md)
        - XML Code Comments
        - Other
    validations:
      required: true

  - type: dropdown
    id: issue-type
    attributes:
      label: Issue Type
      description: What type of documentation issue is this?
      options:
        - Outdated or inaccurate information
        - Hard to understand
        - Missing information
        - Typos / grammar errors
        - Missing examples
        - Example code doesn't work
        - Formatting / layout issues
        - Broken links
        - Other
    validations:
      required: true

  - type: textarea
    id: location
    attributes:
      label: Issue Location
      description: Please specify the section or line number where the issue is located
      placeholder: |
        File: docs/api-guide.md
        Section: 2.3 Code Analysis Tools
        Line numbers: approximately lines 45-50
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Issue Description
      description: Describe the documentation issue
      placeholder: This description is unclear...
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Improvement Suggestion
      description: How do you suggest improving it?
      placeholder: Suggest changing it to...
    validations:
      required: false

  - type: textarea
    id: proposed-content
    attributes:
      label: Proposed Content (Optional)
      description: If you have specific text for the improvement, please provide it here
      placeholder: |
        ## New Heading
        New content...
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Willingness to Contribute
      options:
        - label: I am willing to submit a PR to fix this documentation issue
          required: false
        - label: I need help writing the improved content
          required: false
