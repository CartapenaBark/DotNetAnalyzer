name: Feature Request
description: Suggest a new feature or improvement for DotNetAnalyzer
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your feature request! Please fill in the information below to help us understand and evaluate your suggestion.

  - type: textarea
    id: problem
    attributes:
      label: Problem Description
      description: What problem or pain point are you experiencing? What problem does this feature try to solve?
      placeholder: When using DotNetAnalyzer...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like to solve this problem? Describe the feature or improvement you'd like
      placeholder: I would like to be able to...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other solutions or workarounds have you considered?
      placeholder: I have tried...
    validations:
      required: false

  - type: textarea
    id: use-cases
    attributes:
      label: Use Cases
      description: Describe specific use cases to help us understand the value of the feature
      placeholder: |
        Scenario 1: When I want to analyze a large codebase...
        Scenario 2: When refactoring a specific type of code...
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: Which category does this feature belong to?
      options:
        - New MCP tool
        - Improvement to existing tool
        - Performance optimization
        - Documentation improvement
        - Developer experience
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - 🔴 Required - I cannot use the project without this feature
        - 🟡 Important - Significantly improves the user experience
        - 🟢 Nice to have - Would be good to have but not essential
        - ⚪ Optional - A nice-to-have feature
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: Implementation Ideas (Optional)
      description: If you have implementation ideas or technical suggestions, please share them here
      placeholder: I think this could be done by...
    validations:
      required: false

  - type: textarea
    id: examples
    attributes:
      label: Examples or References (Optional)
      description: Are there similar tools or implementations we can reference?
      placeholder: |
        - Roslyn's xxx API
        - ReSharper's xxx feature
        - Other similar tools...
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Willingness to Contribute
      options:
        - label: I am willing to implement this feature (with guidance)
          required: false
        - label: I am willing to help test and validate this feature
          required: false
        - label: I am willing to write related documentation
          required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Any other information that helps understand this request
      placeholder: Screenshots, links, sample code, etc...
    validations:
      required: false
