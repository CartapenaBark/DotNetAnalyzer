name: Question
description: Ask a question about DotNetAnalyzer
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Have a question? Please check the following resources before submitting an issue:

        - 📖 [README.md](../../README.md) - Project overview and quick start
        - 📚 [API Guide](../../docs/api-guide.md) - Detailed API documentation
        - 💡 [Usage Examples](../../docs/examples.md) - Practical examples
        - ❓ [FAQ](../../docs/FAQ.md) - Frequently asked questions

        If you found the answer, please close this issue.

  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: Clearly describe your question
      placeholder: I would like to know how to...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Background / Context
      description: Provide relevant background information to help us understand your scenario
      placeholder: I am trying to...
    validations:
      required: true

  - type: textarea
    id: research
    attributes:
      label: Methods Already Tried
      description: What methods have you already tried or which documents have you consulted?
      placeholder: I tried..., I looked at...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Information
      description: Relevant runtime environment
      placeholder: |
        - OS: [e.g. Windows 11]
        - .NET Version: [e.g. 8.0.301]
        - DotNetAnalyzer Version: [e.g. v0.8.0]
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I have searched existing issues and discussions and did not find a duplicate
          required: true
        - label: I have read the relevant documentation
          required: true
