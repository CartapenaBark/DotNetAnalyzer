name: Build and Publish

on:
  push:
    branches: [ develop ]
    tags: ['v*.*.*']
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  extract_version:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      should_tag: ${{ steps.check_release.outputs.should_tag }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Extract version from csproj
      id: get_version
      run: |
        VERSION=$(xmllint --xpath 'string(//Version)' src/DotNetAnalyzer.Cli/DotNetAnalyzer.Cli.csproj)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Extracted version: $VERSION"

    - name: Check if release commit
      id: check_release
      run: |
        LAST_COMMIT_MSG=$(git log -1 --pretty=%B)
        if echo "$LAST_COMMIT_MSG" | grep -q "版本准备\|release\|v${{ steps.get_version.outputs.version }}"; then
          echo "should_tag=true" >> $GITHUB_OUTPUT
          echo "This is a release commit, will create tag"
        else
          echo "should_tag=false" >> $GITHUB_OUTPUT
          echo "Not a release commit, skipping tag creation"
        fi

    - name: Create and push tag
      if: steps.check_release.outputs.should_tag == 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG_NAME="v${{ steps.get_version.outputs.version }}"
        echo "Creating tag: $TAG_NAME"
        git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
        git push origin "$TAG_NAME"

  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release

    - name: Test (.NET 10.0)
      run: dotnet test -c Release --framework net10.0 --verbosity normal

    - name: Pack
      run: dotnet pack src/DotNetAnalyzer.Cli/DotNetAnalyzer.Cli.csproj -c Release

    - name: Upload NuGet packages
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: Bin/nupkg/*.nupkg
        retention-days: 7

  publish_nuget:
    needs: [build, extract_version]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download NuGet packages
      uses: actions/download-artifact@v4
      with:
        name: nuget-packages

    - name: Publish to NuGet.org
      run: |
        for package in *.nupkg; do
          if [[ ! "$package" =~ \.snupkg$ ]]; then
            dotnet nuget push "$package" \
              --api-key ${{ secrets.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          fi
        done

  create_github_release:
    needs: [build, extract_version]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download NuGet packages
      uses: actions/download-artifact@v4
      with:
        name: nuget-packages

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: '*.nupkg'
        generate_release_notes: true
        draft: false
        prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
