name: Build and Publish

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  extract_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
    - name: Extract version from tag
      id: get_version
      run: |
        # 从 GITHUB_REF 获取 tag 名称，格式如 refs/tags/v1.0.0
        TAG_NAME=${GITHUB_REF#refs/tags/}
        VERSION=${TAG_NAME#v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Tag: $TAG_NAME, Version: $VERSION"

  build:
    runs-on: ubuntu-latest
    needs: extract_version

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore DotNetAnalyzer.slnx -p:Configuration=Release --verbosity minimal

    - name: Build
      run: dotnet build DotNetAnalyzer.slnx -c Release --no-restore --verbosity minimal -p:Version=${{ needs.extract_version.outputs.version }}

    - name: Test (.NET 10.0)
      run: dotnet test DotNetAnalyzer.slnx -c Release --framework net10.0 --no-build --verbosity normal --filter "Category!=Performance"

    - name: Pack
      run: dotnet pack src/DotNetAnalyzer.Cli/DotNetAnalyzer.Cli.csproj -c Release -p:Version=${{ needs.extract_version.outputs.version }}

    - name: Upload NuGet packages
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: Bin/nupkg/*.nupkg
        retention-days: 7

  publish_nuget:
    needs: [build, extract_version]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download NuGet packages
      uses: actions/download-artifact@v4
      with:
        name: nuget-packages

    - name: Publish to NuGet.org
      run: |
        for package in *.nupkg; do
          if [[ ! "$package" =~ \.snupkg$ ]]; then
            dotnet nuget push "$package" \
              --api-key ${{ secrets.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          fi
        done

  create_github_release:
    needs: [build, extract_version]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download NuGet packages
      uses: actions/download-artifact@v4
      with:
        name: nuget-packages

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: '*.nupkg'
        generate_release_notes: true
        draft: false
        prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
